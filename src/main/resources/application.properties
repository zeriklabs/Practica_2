spring.application.name=practica2
server.port=${PORT:8080}

# ===================================================================
# Configuración de Base de Datos H2 (En memoria por defecto para pruebas y desarrollo)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:entrenadoresdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ===================================================================
# Configuración para MySQL / MariaDB (Descomentar para usar en producción o Render)
# ===================================================================
# spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:entrenadores_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${DB_USER:root}
# spring.datasource.password=${DB_PASSWORD:root}
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# Configuración de JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ===================================================================
# Configuración de Seguridad y JWT
# ===================================================================
jwt.secret=practica2_super_secret_jwt_key_with_at_least_256_bits_length_123456789
jwt.expiration=86400000

# ===================================================================
# Configuración de Swagger / OpenAPI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
